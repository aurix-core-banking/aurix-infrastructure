# AUREUS - Stack de dados (PostgreSQL, ClickHouse, Kafka, Redis, etc.)
# Executar a partir desta pasta: docker-compose up -d
# Init scripts do Postgres: ./init-scripts (nesta pasta)

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aurix-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aurix}
      POSTGRES_USER: ${POSTGRES_USER:-aurix_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurix_dev_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    command: >
      postgres
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c work_mem=64MB
      -c maintenance_work_mem=512MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c max_connections=200
      -c log_statement=all
      -c log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurix_user -d aurix"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aurix-network

  clickhouse:
    image: clickhouse/clickhouse-server:23.8-alpine
    container_name: aurix-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-aurix_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-aurix_analytics}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-aurix_dev_password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aurix-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: aurix-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - aurix-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: aurix-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aurix-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    container_name: aurix-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aurix-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.0
    container_name: aurix-kibana
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - aurix-network

  redis:
    image: redis:7-alpine
    container_name: aurix-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-aurix_dev_password} --maxmemory 1gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aurix-network

  minio:
    image: minio/minio:latest
    container_name: aurix-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aurix_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - aurix-network

  timescaledb:
    image: timescale/timescaledb:2.11-pg15
    container_name: aurix-timescaledb
    environment:
      POSTGRES_DB: ${TIMESCALEDB_DB:-aurix_timeseries}
      POSTGRES_USER: ${TIMESCALEDB_USER:-aurix_timeseries}
      POSTGRES_PASSWORD: ${TIMESCALEDB_PASSWORD:-timescaledb_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1GB
      -c work_mem=32MB
      -c maintenance_work_mem=256MB
      -c max_connections=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurix_timeseries -d aurix_timeseries"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aurix-network

  prometheus:
    image: prom/prometheus:latest
    container_name: aurix-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - aurix-network

  grafana:
    image: grafana/grafana:latest
    container_name: aurix-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana_dev_password}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - aurix-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: aurix-kafka-ui
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: aurix-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "8080:8080"
    networks:
      - aurix-network

  iceberg-rest:
    image: ghcr.io/tabulario/iceberg-rest:latest
    container_name: aurix-iceberg-rest
    depends_on:
      - postgres
      - minio
    environment:
      CATALOG_WAREHOUSE: s3://aurix-warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH_STYLE_ACCESS: "true"
      CATALOG_S3_ACCESS_KEY_ID: aurix_admin
      CATALOG_S3_SECRET_ACCESS_KEY: aurix_secure_password
      CATALOG_CATALOG_IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://postgres:5432/aurix
      CATALOG_JDBC_USER: aurix_user
      CATALOG_JDBC_PASSWORD: aurix_secure_password
    ports:
      - "8181:8181"
    networks:
      - aurix-network

  trino:
    image: trinodb/trino:424
    container_name: aurix-trino
    depends_on:
      - postgres
      - clickhouse
      - minio
      - iceberg-rest
    ports:
      - "8090:8090"
    volumes:
      - ./trino/config.properties:/etc/trino/config.properties
      - ./trino/node.properties:/etc/trino/node.properties
      - ./trino/jvm.config:/etc/trino/jvm.config
      - ./trino/catalog:/etc/trino/catalog
    networks:
      - aurix-network

  airflow-init:
    image: apache/airflow:2.7.3
    container_name: aurix-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
    user: "0"
    command: >
      bash -c "
        airflow db init &&
        airflow users create -r Admin -u airflow -e airflow@aurix.local -f Air -l Flow -p airflow || true
      "
    volumes:
      - ../../data-pipelines/airflow/dags:/opt/airflow/dags
    networks:
      - aurix-network

  airflow-webserver:
    image: apache/airflow:2.7.3
    container_name: aurix-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      _PIP_ADDITIONAL_PACKAGES: "apache-airflow-providers-postgres apache-airflow-providers-apache-kafka minio boto3 pandas pyarrow dbt-postgres"
    user: "50000:0"
    ports:
      - "8082:8080"
    volumes:
      - ../../data-pipelines/airflow/dags:/opt/airflow/dags
      - ../../data-pipelines/dbt:/opt/airflow/dbt
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aurix-network

  airflow-scheduler:
    image: apache/airflow:2.7.3
    container_name: aurix-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      _PIP_ADDITIONAL_PACKAGES: "apache-airflow-providers-postgres apache-airflow-providers-apache-kafka minio boto3 pandas pyarrow dbt-postgres"
    user: "50000:0"
    volumes:
      - ../../data-pipelines/airflow/dags:/opt/airflow/dags
      - ../../data-pipelines/dbt:/opt/airflow/dbt
    command: scheduler
    networks:
      - aurix-network

volumes:
  postgres_data:
  clickhouse_data:
  kafka_data:
  zookeeper_data:
  zookeeper_logs:
  elasticsearch_data:
  redis_data:
  minio_data:
  timescaledb_data:
  prometheus_data:
  grafana_data:

networks:
  aurix-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
