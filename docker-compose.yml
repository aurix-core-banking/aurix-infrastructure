services:
  # ═══════════════════════════════════════════════════════════════════════
  # TRAEFIK — API Gateway
  # ═══════════════════════════════════════════════════════════════════════
  traefik:
    image: traefik:v3.0
    container_name: aurix-gateway
    command:
      - "--api.dashboard=true"
      - "--log.level=INFO"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:8080"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=web"
    ports:
      - "8080:8080"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - aurix-network

  # ═══════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE — Databases & Messaging
  # ═══════════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:15-alpine
    container_name: aurix-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aurix_db}
      POSTGRES_USER: ${POSTGRES_USER:-aurix_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurix_dev_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=pt_BR.UTF-8 --lc-ctype=pt_BR.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - aurix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurix -d aurix"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aurix-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - aurix-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: aurix-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - aurix-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: aurix-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - aurix-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: aurix-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - aurix-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: aurix-kibana
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - aurix-network

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: aurix-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - aurix-network

  grafana:
    image: grafana/grafana:10.1.0
    container_name: aurix-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-grafana_dev_password}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - aurix-network

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: aurix-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    depends_on:
      - prometheus
    networks:
      - aurix-network

  minio:
    image: minio/minio:latest
    container_name: aurix-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aurix}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_dev_password}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - aurix-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    container_name: aurix-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak123}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev}
      KC_LOG_LEVEL: INFO
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
    ports:
      - "8443:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - keycloak_data:/opt/keycloak/data
    command: start-dev
    networks:
      - aurix-network

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: aurix-clickhouse
    ports:
      - "8123:8123"
      - "9002:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-aurix_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-aurix}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_dev_password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - aurix-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:2.12.1-pg15
    container_name: aurix-timescaledb
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${TIMESCALEDB_DB:-aurix_timeseries}
      POSTGRES_USER: ${TIMESCALEDB_USER:-aurix}
      POSTGRES_PASSWORD: ${TIMESCALEDB_PASSWORD:-timescaledb_dev_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=pt_BR.UTF-8 --lc-ctype=pt_BR.UTF-8"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    networks:
      - aurix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurix -d aurix_timeseries"]
      interval: 10s
      timeout: 5s
      retries: 5

  # BACEN WireMock — Simula SPI/STR do Banco Central para PIX
  bacen-mock:
    image: wiremock/wiremock:latest
    container_name: aurix-bacen-mock
    ports:
      - "8095:8095"
    volumes:
      - ./bacen-mock/mappings:/home/wiremock/mappings
    command: ["--port", "8095", "--verbose"]
    networks:
      - aurix-network

