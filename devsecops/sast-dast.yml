name: SAST/DAST Security Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  sast-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 25
      uses: actions/setup-java@v3
      with:
        java-version: '25'
        distribution: 'temurin'
    
    - name: Run SpotBugs Security
      run: |
        cd backend
        mvn spotbugs:check
        mvn spotbugs:gui
    
    - name: Run PMD Security Rules
      run: |
        cd backend
        mvn pmd:check
        mvn pmd:cpd-check
    
    - name: Run Checkstyle Security
      run: |
        cd backend
        mvn checkstyle:check
    
    - name: Run OWASP Dependency Check
      run: |
        cd backend
        mvn org.owasp:dependency-check-maven:check
    
    - name: Run FindSecBugs
      run: |
        cd backend
        mvn compile
        mvn com.h3xstream.findsecbugs:findsecbugs-maven-plugin:findbugs
    
    - name: Run CodeQL Analysis
      uses: github/codeql-action/analyze@v2
      with:
        languages: java, javascript, python

  dast-scan:
    runs-on: ubuntu-latest
    needs: sast-scan
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Start application
      run: |
        docker-compose -f infra/docker-compose.dev.yml up -d
        sleep 60  # Wait for services to start
    
    - name: Run OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.7.0
      with:
        target: 'http://localhost:8080'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'
    
    - name: Run OWASP ZAP Full Scan
      uses: zaproxy/action-full-scan@v0.4.0
      with:
        target: 'http://localhost:8080'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'
    
    - name: Run Nikto Web Scanner
      run: |
        docker run --rm \
          -v $(pwd):/tmp \
          sullo/nikto \
          -h http://localhost:8080 \
          -output /tmp/nikto-report.html
    
    - name: Run SQLMap
      run: |
        docker run --rm \
          -v $(pwd):/tmp \
          paoloo/sqlmap \
          -u "http://localhost:8080/api/core/contas" \
          --batch \
          --output-dir=/tmp/sqlmap-results
    
    - name: Run Wapiti
      run: |
        docker run --rm \
          -v $(pwd):/tmp \
          wapiti-scanner/wapiti \
          -u http://localhost:8080 \
          -f html \
          -o /tmp/wapiti-results
    
    - name: Run Nuclei
      run: |
        docker run --rm \
          -v $(pwd):/tmp \
          projectdiscovery/nuclei \
          -u http://localhost:8080 \
          -o /tmp/nuclei-results.txt
    
    - name: Run Burp Suite Professional
      run: |
        docker run --rm \
          -v $(pwd):/tmp \
          -e BURP_API_KEY=${{ secrets.BURP_API_KEY }} \
          portswigger/burp-suite-professional \
          --headless \
          --api-key $BURP_API_KEY \
          --target http://localhost:8080 \
          --output /tmp/burp-results.json
