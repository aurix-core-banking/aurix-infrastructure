worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    upstream aurix_gateway {
        server aurix-gateway:8080;
    }
    upstream aurix_core {
        server aurix-core:8081;
    }
    upstream aurix_pix {
        server aurix-pix:8082;
    }
    upstream aurix_credit {
        server aurix-credit:8083;
    }
    upstream aurix_treasury {
        server aurix-treasury:8084;
    }
    upstream aurix_security {
        server aurix-security:8085;
    }
    upstream aurix_compliance {
        server aurix-compliance:8086;
    }
    upstream aurix_analytics {
        server aurix-analytics:8101;
    }
    upstream aurix_audit {
        server aurix-audit:8088;
    }
    upstream aurix_organization {
        server aurix-organization:8100;
    }

    server {
        listen 80;
        server_name localhost;

        location /api/gateway/ {
            proxy_pass http://aurix_gateway/;
            proxy_set_header Host $server_name;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/core/ {
            proxy_pass http://aurix_core/api/core/;
            proxy_set_header Host $server_name;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/pix/ {
            proxy_pass http://aurix_pix/api/pix/;
            proxy_set_header Host $server_name;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/credit/ {
            proxy_pass http://aurix_credit/api/credit/;
            proxy_set_header Host $server_name;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/treasury/ {
            proxy_pass http://aurix_treasury/api/treasury/;
            proxy_set_header Host $server_name;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/security/ {
            proxy_pass http://aurix_security/api/security/;
            proxy_set_header Host $server_name;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/compliance/ {
            proxy_pass http://aurix_compliance/api/compliance/;
            proxy_set_header Host $server_name;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/analytics/ {
            proxy_pass http://aurix_analytics/api/analytics/;
            proxy_set_header Host $server_name;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/audit/ {
            proxy_pass http://aurix_audit/api/audit/;
            proxy_set_header Host $server_name;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/organization/ {
            proxy_pass http://aurix_organization/;
            proxy_set_header Host $server_name;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /health {
            proxy_pass http://aurix_gateway/health;
            proxy_set_header Host $server_name;
        }
    }
}

