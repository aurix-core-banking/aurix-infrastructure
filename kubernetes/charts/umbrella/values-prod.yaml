global:
  environment: production
  replicas: 3
  imageTag: stable
  imagePullPolicy: IfNotPresent

aurix-core:
  replicaCount: 3
  env:
    SPRING_PROFILES_ACTIVE: production
  resources:
    requests:
      memory: 1Gi
      cpu: 500m
    limits:
      memory: 2Gi
      cpu: 1
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 2
  nodeSelector:
    node-type: general

aurix-gateway:
  replicaCount: 3
  env:
    SPRING_PROFILES_ACTIVE: production
