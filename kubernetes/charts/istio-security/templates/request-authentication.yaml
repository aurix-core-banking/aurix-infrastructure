{{- if .Values.jwt.issuer }}
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: keycloak-jwt
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: aurix-platform
  jwtRules:
  - issuer: "{{ .Values.jwt.issuer }}"
    jwksUri: "{{ .Values.jwt.jwksUri }}"
    forwardOriginalToken: true
    outputPayloadToHeader: x-jwt-payload
    fromHeaders:
    - name: Authorization
      prefix: "Bearer "
    outputClaimToHeaders:
    - header: x-jwt-sub
      claim: sub
    - header: x-jwt-email
      claim: email
{{- end }}
