apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  name: aurix-istio
  namespace: istio-system
spec:
  profile: default
  components:
    ingressGateways:
    - name: istio-ingressgateway
      enabled: true
      k8s:
        service:
          type: LoadBalancer
          ports:
          - port: 80
            name: http
          - port: 443
            name: https
    egressGateways:
    - name: istio-egressgateway
      enabled: false
  meshConfig:
    accessLogFile: /dev/stdout
    enableTracing: true
