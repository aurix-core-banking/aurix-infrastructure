apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: aurix
  namespace: elastic-system
spec:
  version: 8.11.0
  count: 1
  elasticsearchRef:
    name: aurix
  config:
    server.publicBaseUrl: https://kibana.aurix-platform.com
  podTemplate:
    spec:
      containers:
      - name: kibana
        resources:
          requests:
            memory: 1Gi
            cpu: 500m
