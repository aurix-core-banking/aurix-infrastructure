apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-components
  namespace: argocd
spec:
  project: infra
  source:
    repoURL: https://github.com/anomalyco/aurix-platform
    path: infra/kubernetes/charts/infra
    targetRevision: HEAD
    helm:
      valueFiles:
      - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
