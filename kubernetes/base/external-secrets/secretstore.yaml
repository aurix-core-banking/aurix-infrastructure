apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: aurix-platform
spec:
  provider:
    vault:
      server: "https://vault.vault.svc.cluster.local:8200"
      path: "aurix"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "aurix-platform"
          serviceAccountRef:
            name: default
