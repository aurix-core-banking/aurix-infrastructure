# AUREUS Platform - Juju Bundle
# Modelagem de aplicações para AUREUS Core Banking

bundle: kubernetes
applications:
  # PostgreSQL Database
  postgresql:
    charm: postgresql
    series: focal
    channel: 14/stable
    num_units: 1
    options:
      profile: production
      memory: 2GB
      cpu: 2
    constraints: "mem=2G cpu=2"
    bindings:
      - database
    resources:
      postgresql-image: 0

  # Redis Cache
  redis:
    charm: redis
    series: focal
    channel: 6/stable
    num_units: 1
    options:
      maxmemory: 1GB
      maxmemory-policy: allkeys-lru
    constraints: "mem=1G cpu=1"
    bindings:
      - cache
    resources:
      redis-image: 0

  # Kafka Message Broker
  kafka:
    charm: kafka
    series: focal
    channel: 3/stable
    num_units: 3
    options:
      num_partitions: 3
      default_replication_factor: 3
    constraints: "mem=2G cpu=2"
    bindings:
      - message-queue
    resources:
      kafka-image: 0

  # Zookeeper for Kafka
  zookeeper:
    charm: zookeeper
    series: focal
    channel: 3/stable
    num_units: 3
    options:
      tick_time: 2000
      init_limit: 10
      sync_limit: 5
    constraints: "mem=1G cpu=1"
    bindings:
      - coordination
    resources:
      zookeeper-image: 0

  # AUREUS Core Service
  aurix-core:
    charm: aurix-core
    series: focal
    channel: edge
    num_units: 3
    options:
      port: 8080
      management_port: 8081
      log_level: INFO
    constraints: "mem=1G cpu=1"
    bindings:
      - web
    resources:
      aurix-core-image: 0

  # AUREUS PIX Service
  aurix-pix:
    charm: aurix-pix
    series: focal
    channel: edge
    num_units: 2
    options:
      port: 8081
      management_port: 8082
      log_level: INFO
    constraints: "mem=1G cpu=1"
    bindings:
      - web
    resources:
      aurix-pix-image: 0

  # AUREUS Credit Service
  aurix-credit:
    charm: aurix-credit
    series: focal
    channel: edge
    num_units: 2
    options:
      port: 8082
      management_port: 8083
      log_level: INFO
    constraints: "mem=1G cpu=1"
    bindings:
      - web
    resources:
      aurix-credit-image: 0

  # AUREUS Treasury Service
  aurix-treasury:
    charm: aurix-treasury
    series: focal
    channel: edge
    num_units: 2
    options:
      port: 8083
      management_port: 8084
      log_level: INFO
    constraints: "mem=1G cpu=1"
    bindings:
      - web
    resources:
      aurix-treasury-image: 0

  # AUREUS Security Service
  aurix-security:
    charm: aurix-security
    series: focal
    channel: edge
    num_units: 2
    options:
      port: 8084
      management_port: 8085
      log_level: INFO
    constraints: "mem=1G cpu=1"
    bindings:
      - web
    resources:
      aurix-security-image: 0

  # AUREUS Compliance Service
  aurix-compliance:
    charm: aurix-compliance
    series: focal
    channel: edge
    num_units: 2
    options:
      port: 8085
      management_port: 8086
      log_level: INFO
    constraints: "mem=1G cpu=1"
    bindings:
      - web
    resources:
      aurix-compliance-image: 0

  # AUREUS Analytics Service
  aurix-analytics:
    charm: aurix-analytics
    series: focal
    channel: edge
    num_units: 2
    options:
      port: 8086
      management_port: 8087
      log_level: INFO
    constraints: "mem=2G cpu=2"
    bindings:
      - web
    resources:
      aurix-analytics-image: 0

  # AUREUS Audit Service
  aurix-audit:
    charm: aurix-audit
    series: focal
    channel: edge
    num_units: 2
    options:
      port: 8087
      management_port: 8088
      log_level: INFO
    constraints: "mem=1G cpu=1"
    bindings:
      - web
    resources:
      aurix-audit-image: 0

  # AUREUS Gateway Service
  aurix-gateway:
    charm: aurix-gateway
    series: focal
    channel: edge
    num_units: 2
    options:
      port: 8088
      management_port: 8089
      log_level: INFO
    constraints: "mem=1G cpu=1"
    bindings:
      - web
    resources:
      aurix-gateway-image: 0

  # AUREUS Organization Service
  aurix-organization:
    charm: aurix-organization
    series: focal
    channel: edge
    num_units: 2
    options:
      port: 8089
      management_port: 8090
      log_level: INFO
    constraints: "mem=1G cpu=1"
    bindings:
      - web
    resources:
      aurix-organization-image: 0

  # Nginx Load Balancer
  nginx:
    charm: nginx
    series: focal
    channel: stable
    num_units: 2
    options:
      enable_modules: "http_ssl,http_realip,http_geoip,http_stub_status"
      worker_processes: auto
      worker_connections: 1024
    constraints: "mem=512M cpu=1"
    bindings:
      - web
    resources:
      nginx-image: 0

  # Prometheus Monitoring
  prometheus:
    charm: prometheus
    series: focal
    channel: stable
    num_units: 1
    options:
      web_external_url: "http://prometheus:9090"
      storage_tsdb_retention_time: 30d
    constraints: "mem=2G cpu=2"
    bindings:
      - monitoring
    resources:
      prometheus-image: 0

  # Grafana Dashboard
  grafana:
    charm: grafana
    series: focal
    channel: stable
    num_units: 1
    options:
      admin_password: "aurix123"
      admin_user: "admin"
    constraints: "mem=1G cpu=1"
    bindings:
      - monitoring
    resources:
      grafana-image: 0

  # Elasticsearch for Logs
  elasticsearch:
    charm: elasticsearch
    series: focal
    channel: 8/stable
    num_units: 3
    options:
      heap_size: 1GB
      cluster_name: aurix-cluster
    constraints: "mem=2G cpu=2"
    bindings:
      - logging
    resources:
      elasticsearch-image: 0

  # Kibana for Log Analysis
  kibana:
    charm: kibana
    series: focal
    channel: 8/stable
    num_units: 1
    options:
      kibana_index: ".kibana"
    constraints: "mem=1G cpu=1"
    bindings:
      - logging
    resources:
      kibana-image: 0

  # Logstash for Log Processing
  logstash:
    charm: logstash
    series: focal
    channel: 8/stable
    num_units: 2
    options:
      heap_size: 1GB
    constraints: "mem=2G cpu=2"
    bindings:
      - logging
    resources:
      logstash-image: 0

relations:
  # Database Relations
  - [aurix-core, postgresql:database]
  - [aurix-pix, postgresql:database]
  - [aurix-credit, postgresql:database]
  - [aurix-treasury, postgresql:database]
  - [aurix-security, postgresql:database]
  - [aurix-compliance, postgresql:database]
  - [aurix-analytics, postgresql:database]
  - [aurix-audit, postgresql:database]
  - [aurix-organization, postgresql:database]

  # Cache Relations
  - [aurix-core, redis:cache]
  - [aurix-pix, redis:cache]
  - [aurix-credit, redis:cache]
  - [aurix-treasury, redis:cache]
  - [aurix-security, redis:cache]
  - [aurix-compliance, redis:cache]
  - [aurix-analytics, redis:cache]
  - [aurix-audit, redis:cache]
  - [aurix-organization, redis:cache]

  # Message Queue Relations
  - [kafka, zookeeper:zookeeper]
  - [aurix-core, kafka:message-queue]
  - [aurix-pix, kafka:message-queue]
  - [aurix-credit, kafka:message-queue]
  - [aurix-treasury, kafka:message-queue]
  - [aurix-security, kafka:message-queue]
  - [aurix-compliance, kafka:message-queue]
  - [aurix-analytics, kafka:message-queue]
  - [aurix-audit, kafka:message-queue]
  - [aurix-organization, kafka:message-queue]

  # Load Balancer Relations
  - [nginx, aurix-core:web]
  - [nginx, aurix-pix:web]
  - [nginx, aurix-credit:web]
  - [nginx, aurix-treasury:web]
  - [nginx, aurix-security:web]
  - [nginx, aurix-compliance:web]
  - [nginx, aurix-analytics:web]
  - [nginx, aurix-audit:web]
  - [nginx, aurix-organization:web]

  # Monitoring Relations
  - [prometheus, aurix-core:metrics]
  - [prometheus, aurix-pix:metrics]
  - [prometheus, aurix-credit:metrics]
  - [prometheus, aurix-treasury:metrics]
  - [prometheus, aurix-security:metrics]
  - [prometheus, aurix-compliance:metrics]
  - [prometheus, aurix-analytics:metrics]
  - [prometheus, aurix-audit:metrics]
  - [prometheus, aurix-organization:metrics]
  - [grafana, prometheus:prometheus]

  # Logging Relations
  - [logstash, elasticsearch:elasticsearch]
  - [kibana, elasticsearch:elasticsearch]
  - [logstash, aurix-core:logging]
  - [logstash, aurix-pix:logging]
  - [logstash, aurix-credit:logging]
  - [logstash, aurix-treasury:logging]
  - [logstash, aurix-security:logging]
  - [logstash, aurix-compliance:logging]
  - [logstash, aurix-analytics:logging]
  - [logstash, aurix-audit:logging]
  - [logstash, aurix-organization:logging]

machines:
  # Database Machine
  database:
    constraints: "mem=4G cpu=4"
    series: focal

  # Application Machines
  app1:
    constraints: "mem=8G cpu=4"
    series: focal

  app2:
    constraints: "mem=8G cpu=4"
    series: focal

  app3:
    constraints: "mem=8G cpu=4"
    series: focal

  # Monitoring Machine
  monitoring:
    constraints: "mem=4G cpu=2"
    series: focal

  # Logging Machine
  logging:
    constraints: "mem=8G cpu=4"
    series: focal

placement:
  - postgresql: database
  - redis: database
  - zookeeper: database
  - kafka: database
  - aurix-core: app1
  - aurix-pix: app1
  - aurix-credit: app1
  - aurix-treasury: app2
  - aurix-security: app2
  - aurix-compliance: app2
  - aurix-analytics: app3
  - aurix-audit: app3
  - aurix-organization: app3
  - nginx: app1
  - prometheus: monitoring
  - grafana: monitoring
  - elasticsearch: logging
  - kibana: logging
  - logstash: logging
