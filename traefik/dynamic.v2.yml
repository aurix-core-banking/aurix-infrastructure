# infra/traefik/dynamic.v2.yml
# Configuração de rotas para 13 domínios consolidados

http:
  middlewares:
    ratelimit-default:
      rateLimit:
        average: 200
        burst: 400

    ratelimit-payments:
      rateLimit:
        average: 500
        burst: 1000

    ratelimit-fraud:
      rateLimit:
        average: 1000
        burst: 2000

    ratelimit-compliance:
      rateLimit:
        average: 50
        burst: 100

    cors-headers:
      headers:
        accessControlAllowOriginList:
          - "http://localhost:3000"
          - "http://localhost:3001"
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - "Content-Type"
          - "Authorization"
          - "X-Tenant-Id"


  routers:
    # ── svc-banking (8200) — Core bancário, contas, transações, poupança, salario ──
    banking-core:
      rule: "PathPrefix(`/api/core`) || PathPrefix(`/api/transacoes`) || PathPrefix(`/api/settlement`) || PathPrefix(`/api/pricing`) || PathPrefix(`/api/controle-saldos`) || PathPrefix(`/api/gestao-risco`) || PathPrefix(`/api/liquidacao`) || PathPrefix(`/api/motor-tarifas`) || PathPrefix(`/api/remuneracao`)"
      service: svc-banking
      middlewares:
        - ratelimit-default
        - cors-headers
      entrypoints:
        - web

    banking-empresas:
      rule: "PathPrefix(`/api/banking`)"
      service: svc-banking
      middlewares:
        - ratelimit-default
        - cors-headers
      entrypoints:
        - web

    banking-poupanca:
      rule: "PathPrefix(`/api/poupanca`)"
      service: svc-banking
      middlewares:
        - ratelimit-default
        - cors-headers
      entrypoints:
        - web

    banking-salario:
      rule: "PathPrefix(`/api/salario`)"
      service: svc-banking
      middlewares:
        - ratelimit-default
        - cors-headers
      entrypoints:
        - web

    # ── svc-payments (8201) — PIX ──
    payments-pix:
      rule: "PathPrefix(`/api/pix`)"
      service: svc-payments
      middlewares:
        - ratelimit-payments
        - cors-headers
      entrypoints:
        - web

    # ── svc-credit (8082) — Crédito, consignado, financiamento ──
    credit:
      rule: "PathPrefix(`/api/credit`) || PathPrefix(`/api/consignado`) || PathPrefix(`/api/financiamento`)"
      service: svc-credit
      middlewares:
        - ratelimit-default
        - cors-headers
      entrypoints:
        - web

    # ── svc-customer (8083) — Clientes, KYC, auth ──
    customer:
      rule: "PathPrefix(`/api/customer`) || PathPrefix(`/api/mfa`) || PathPrefix(`/api/security`) || PathPrefix(`/api/onboarding`) || PathPrefix(`/auth`) || PathPrefix(`/api/clientes`) || PathPrefix(`/solicitacoes`)"
      service: svc-customer
      middlewares:
        - ratelimit-default
        - cors-headers
      entrypoints:
        - web

    # ── svc-cambio (8093) — Câmbio, BACEN, SPI/STR ──
    cambio:
      rule: "PathPrefix(`/api/cambio`)"
      service: svc-cambio
      middlewares:
        - ratelimit-default
        - cors-headers
      entrypoints:
        - web

    # ── svc-cards (8094) — Cartões crédito/débito ──
    cards:
      rule: "PathPrefix(`/api/cards`)"
      service: svc-cards
      middlewares:
        - ratelimit-default
        - cors-headers
      entrypoints:
        - web

    # ── svc-finance-mgmt (8089) — Contabilidade, orçamento, impostos ──
    finance-mgmt:
      rule: "PathPrefix(`/api/finance`)"
      service: svc-finance-mgmt
      middlewares:
        - ratelimit-default
        - cors-headers
      entrypoints:
        - web

    # ── svc-intelligence (8091) — Analytics, BI ──
    intelligence:
      rule: "PathPrefix(`/api/intelligence`)"
      service: svc-intelligence
      middlewares:
        - ratelimit-default
        - cors-headers
      entrypoints:
        - web

    # ── svc-platform (8092) — OpenFinance, webhooks, notificações ──
    platform:
      rule: "PathPrefix(`/api/platform`) || PathPrefix(`/api/openfinance`) || PathPrefix(`/api/webhooks`) || PathPrefix(`/api/notificacoes`)"
      service: svc-platform
      middlewares:
        - ratelimit-default
        - cors-headers
      entrypoints:
        - web

    # ── svc-fraud (8207) — Detecção de fraude ──
    fraud:
      rule: "PathPrefix(`/api/fraud`)"
      service: svc-fraud
      middlewares:
        - ratelimit-fraud
      entrypoints:
        - web

    # ── svc-compliance (8205) — Compliance, regulação ──
    compliance:
      rule: "PathPrefix(`/api/compliance`)"
      service: svc-compliance
      middlewares:
        - ratelimit-compliance
      entrypoints:
        - web

    # ── svc-ai (8206) — IA, LLM ──
    ai:
      rule: "PathPrefix(`/api/ai`)"
      service: svc-ai
      middlewares:
        - ratelimit-default
        - cors-headers
      entrypoints:
        - web

  services:
    svc-banking:
      loadBalancer:
        servers:
          - url: "http://svc-banking:8200"
        healthCheck:
          path: /actuator/health
          interval: 30s
          timeout: 5s

    svc-payments:
      loadBalancer:
        servers:
          - url: "http://svc-payments:8201"
        healthCheck:
          path: /actuator/health
          interval: 30s
          timeout: 5s

    svc-credit:
      loadBalancer:
        servers:
          - url: "http://svc-credit:8082"
        healthCheck:
          path: /actuator/health
          interval: 30s

    svc-customer:
      loadBalancer:
        servers:
          - url: "http://svc-customer:8083"
        healthCheck:
          path: /actuator/health
          interval: 30s

    svc-cambio:
      loadBalancer:
        servers:
          - url: "http://svc-cambio:8093"
        healthCheck:
          path: /actuator/health
          interval: 30s

    svc-cards:
      loadBalancer:
        servers:
          - url: "http://svc-cards:8094"
        healthCheck:
          path: /actuator/health
          interval: 30s

    svc-finance-mgmt:
      loadBalancer:
        servers:
          - url: "http://svc-finance-mgmt:8089"
        healthCheck:
          path: /actuator/health
          interval: 30s

    svc-intelligence:
      loadBalancer:
        servers:
          - url: "http://svc-intelligence:8091"
        healthCheck:
          path: /actuator/health
          interval: 30s

    svc-platform:
      loadBalancer:
        servers:
          - url: "http://svc-platform:8092"
        healthCheck:
          path: /actuator/health
          interval: 30s

    svc-fraud:
      loadBalancer:
        servers:
          - url: "http://svc-fraud:8207"
        healthCheck:
          path: /actuator/health
          interval: 10s

    svc-compliance:
      loadBalancer:
        servers:
          - url: "http://svc-compliance:8205"
        healthCheck:
          path: /actuator/health
          interval: 30s

    svc-ai:
      loadBalancer:
        servers:
          - url: "http://svc-ai:8206"
        healthCheck:
          path: /actuator/health
          interval: 30s
