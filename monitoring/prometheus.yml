# Aurix Core Banking - Configuração do Prometheus

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'aurix-platform'
    environment: 'development'

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ═══════════════════════════════════════════════════════════════════════
  # API Gateway (Traefik)
  # ═══════════════════════════════════════════════════════════════════════
  - job_name: 'svc-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['traefik:8080']
    scrape_interval: 10s
    scrape_timeout: 5s

  # ═══════════════════════════════════════════════════════════════════════
  # Microservices (svc-*)
  # ═══════════════════════════════════════════════════════════════════════
  - job_name: 'svc-banking'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['svc-banking:8200']
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'svc-payments'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['svc-payments:8201']
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'svc-credit'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['svc-credit:8082']
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'svc-customer'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['svc-customer:8083']
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'svc-products'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['svc-products:8084']
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'svc-contracts'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['svc-contracts:8085']
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'svc-finance-mgmt'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['svc-finance-mgmt:8089']
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'svc-intelligence'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['svc-intelligence:8091']
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'svc-platform'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['svc-platform:8092']
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'svc-cambio'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['svc-cambio:8093']
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'svc-cards'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['svc-cards:8094']
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'svc-compliance'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['svc-compliance:8205']
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'svc-ai'
    metrics_path: '/api/ai/actuator/prometheus'
    static_configs:
      - targets: ['svc-ai:8206']
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'svc-fraud'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['svc-fraud:8207']
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'svc-openfinance'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['svc-openfinance:8096']
    scrape_interval: 10s
    scrape_timeout: 5s

  # ═══════════════════════════════════════════════════════════════════════
  # Infraestrutura
  # ═══════════════════════════════════════════════════════════════════════
  # PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s
    scrape_timeout: 10s

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s
    scrape_timeout: 10s

  # Kafka
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']
    scrape_interval: 30s
    scrape_timeout: 10s

  # Elasticsearch
  - job_name: 'elasticsearch'
    metrics_path: '/_prometheus/metrics'
    static_configs:
      - targets: ['elasticsearch:9200']
    scrape_interval: 30s
    scrape_timeout: 10s

  # Keycloak IAM
  - job_name: 'keycloak'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['keycloak:8080']
    scrape_interval: 15s
    scrape_timeout: 10s
    scheme: http

  # ClickHouse Analytics
  - job_name: 'clickhouse'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['clickhouse:8123']
    scrape_interval: 30s
    scrape_timeout: 10s
    scheme: http

  # TimescaleDB Time-series
  - job_name: 'timescaledb'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['timescaledb:5433']
    scrape_interval: 30s
    scrape_timeout: 10s
    scheme: http

  # Node Exporter (se disponível)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s
    scrape_timeout: 10s

  # Reconciliação contábil (aurix-data-pipelines)
  - job_name: 'reconciliacao'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['reconciliacao-exporter:9102']
    scrape_interval: 60s
    scrape_timeout: 10s
