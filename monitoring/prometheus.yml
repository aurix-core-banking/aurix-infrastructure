# AUREUS Core Banking - Configuração do Prometheus

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'aurix-platform'
    environment: 'development'

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # AUREUS Gateway
  - job_name: 'aurix-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
    scrape_interval: 10s
    scrape_timeout: 5s

  # AUREUS Core
  - job_name: 'aurix-core'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081']
    scrape_interval: 10s
    scrape_timeout: 5s

  # AUREUS PIX
  - job_name: 'aurix-pix'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8082']
    scrape_interval: 10s
    scrape_timeout: 5s

  # AUREUS Credit
  - job_name: 'aurix-credit'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8083']
    scrape_interval: 10s
    scrape_timeout: 5s

  # AUREUS Treasury
  - job_name: 'aurix-treasury'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8084']
    scrape_interval: 10s
    scrape_timeout: 5s

  # AUREUS Compliance
  - job_name: 'aurix-compliance'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8086']
    scrape_interval: 10s
    scrape_timeout: 5s

  # AUREUS Security
  - job_name: 'aurix-security'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8085']
    scrape_interval: 10s
    scrape_timeout: 5s

  # AUREUS Analytics
  - job_name: 'aurix-analytics'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8101']
    scrape_interval: 10s
    scrape_timeout: 5s

  # AUREUS Audit
  - job_name: 'aurix-audit'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8088']
    scrape_interval: 10s
    scrape_timeout: 5s

  # PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s
    scrape_timeout: 10s

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s
    scrape_timeout: 10s

  # Kafka
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']
    scrape_interval: 30s
    scrape_timeout: 10s

  # Elasticsearch
  - job_name: 'elasticsearch'
    metrics_path: '/_prometheus/metrics'
    static_configs:
      - targets: ['elasticsearch:9200']
    scrape_interval: 30s
    scrape_timeout: 10s

  # Keycloak IAM
  - job_name: 'keycloak'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['keycloak:8080']
    scrape_interval: 15s
    scrape_timeout: 10s
    scheme: http

  # ClickHouse Analytics
  - job_name: 'clickhouse'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['clickhouse:8123']
    scrape_interval: 30s
    scrape_timeout: 10s
    scheme: http

  # TimescaleDB Time-series
  - job_name: 'timescaledb'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['timescaledb:5433']
    scrape_interval: 30s
    scrape_timeout: 10s
    scheme: http

  # Data Pipeline Sync
  - job_name: 'data-sync'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['data-sync:8080']
    scrape_interval: 30s
    scrape_timeout: 10s
    scheme: http

  # Real-time Analytics
  - job_name: 'real-time-analytics'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['analytics:5000']
    scrape_interval: 15s
    scrape_timeout: 10s
    scheme: http

  # Node Exporter (se disponível)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s
    scrape_timeout: 10s

