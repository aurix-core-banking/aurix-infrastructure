# Configuração do Alertmanager da Aurix.
# Rota padrão: encaminha para o webhook (ex.: Slack, Rocket.Chat, PagerDuty).
# Personalize `receivers.webhook_configs.url` com o endpoint real.

global:
  resolve_timeout: 5m
  slack_api_url: '${ALERTMANAGER_SLACK_URL:-}'

route:
  receiver: 'default'
  group_by: ['alertname', 'job', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity =~ "critical"
      receiver: 'default'
      repeat_interval: 1h
    - matchers:
        - job =~ "svc-.*"
      receiver: 'default'
    - matchers:
        - job =~ "postgres|redis|kafka|elasticsearch|keycloak|clickhouse|timescaledb"
      receiver: 'default'

receivers:
  - name: 'default'
    webhook_configs:
      - url: '${ALERTMANAGER_WEBHOOK_URL:-http://localhost:9099/alert}'
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ['alertname', 'job']
