groups:
  - name: sla-uptime
    interval: 60s
    rules:
      - record: aurix:up:count
        expr: count(up{job=~"aurix-gateway|aurix-core|aurix-pix"} == 1)
        labels:
          tier: critical
      - record: aurix:up:total
        expr: count(up{job=~"aurix-gateway|aurix-core|aurix-pix"})
        labels:
          tier: critical
      - record: aurix:availability_ratio:5m
        expr: |
          sum(up{job=~"aurix-gateway|aurix-core|aurix-pix"}) or vector(0)
          /
          count(up{job=~"aurix-gateway|aurix-core|aurix-pix"}) or vector(1)
        labels:
          sla_window: 5m

  - name: sla-alerts
    rules:
      - alert: AurixCriticalServiceDown
        expr: up{job=~"aurix-gateway|aurix-core|aurix-pix"} == 0
        for: 2m
        labels:
          severity: critical
          item: "14.4"
        annotations:
          summary: "Servico critico AUREUS indisponivel"
          description: "{{ $labels.job }} esta down ha mais de 2 minutos. Impacto no SLA 99.9%."
          runbook_url: "docs/05-infrastructure/infrastructure/aurix-cloud-runbook.md#r1"

      - alert: AurixSLAAtRisk
        expr: |
          (
            sum(up{job=~"aurix-gateway|aurix-core|aurix-pix"}) or vector(0)
            / count(up{job=~"aurix-gateway|aurix-core|aurix-pix"})
          ) < 1
        for: 5m
        labels:
          severity: critical
          item: "14.4"
        annotations:
          summary: "SLA em risco: um ou mais servicos criticos indisponiveis"
          description: "Disponibilidade dos servicos criticos (gateway, core, pix) abaixo de 100% por 5m."
          runbook_url: "docs/05-infrastructure/infrastructure/aurix-cloud-runbook.md#r1"

      - alert: PostgreSQLDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          item: "14.4"
        annotations:
          summary: "PostgreSQL indisponivel"
          description: "Banco de dados principal nao responde. Verificar R3 no runbook."
          runbook_url: "docs/05-infrastructure/infrastructure/aurix-cloud-runbook.md#r3"
