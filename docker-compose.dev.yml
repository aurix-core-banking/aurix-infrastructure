# docker-compose.dev.yml
# Stack mínima de INFRAESTRUTURA para desenvolvimento local.
# Os serviços Spring Boot (svc-*) são executados a partir da IDE
# (profile dev) apontando para esta infraestrutura.
#
# Uso:
#   docker compose -f docker-compose.dev.yml up -d
#
# Para subir a stack completa (infra + todos os serviços):
#   docker compose up -d

services:
  # ═══════════════════════════════════════════════════════════════════════
  # PostgreSQL — banco de dados compartilhado (aurix_db)
  # ═══════════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:15-alpine
    container_name: aurix-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aurix_db}
      POSTGRES_USER: ${POSTGRES_USER:-aurix_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurix_dev_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=pt_BR.UTF-8 --lc-ctype=pt_BR.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - aurix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurix_user -d aurix_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════════════
  # Redis — cache e sessões
  # ═══════════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: aurix-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - aurix-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════════════
  # Kafka + Zookeeper — mensageria
  # ═══════════════════════════════════════════════════════════════════════
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: aurix-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - aurix-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: aurix-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - aurix-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ═══════════════════════════════════════════════════════════════════════
  # Keycloak — autenticação (porta 8443 mapeada para 8080 do container)
  # ═══════════════════════════════════════════════════════════════════════
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: aurix-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: aurix_user
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-aurix_dev_password}
      KC_HTTP_PORT: 8080
    ports:
      - "8443:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aurix-network
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/aurix HTTP/1.0\r\n\r' >&3 && grep -q '200' <&3 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

# ═══════════════════════════════════════════════════════════════════════
# VOLUMES & NETWORKS
# ═══════════════════════════════════════════════════════════════════════
volumes:
  postgres_data:
  redis_data:
  kafka_data:
  keycloak_data:

networks:
  aurix-network:
    driver: bridge
